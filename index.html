<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Collision</title>
  </head>
  <body>
    <main>
      <h1>Word Collision</h1>
      <p>Round <strong id="round">1</strong></p>
      <p>Category: <strong>color</strong></p>
      <label for="answer">Your one-word answer</label>
      <input id="answer" autocomplete="off" />
      <button id="submit">Submit round</button>
      <p id="status" aria-live="polite"></p>
      <section id="summary" aria-live="polite"></section>
      <section id="round-history"></section>
    </main>
    <script type="module">
      import { scoreRound } from "./src/engine.js";
      import { createSimulatedPlayers } from "./src/simulated-ai.js";
      import { createSession, getTotal, recordRound } from "./src/session.js";

      const session = createSession(["color"], 20);
      const answer = document.querySelector("#answer");
      const status = document.querySelector("#status");
      const summary = document.querySelector("#summary");
      const roundHistory = document.querySelector("#round-history");

      function escapeHtml(value) {
        return String(value ?? "—").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));
      }

      function renderState() {
        document.querySelector("#round").textContent = session.roundIndex + 1;
        summary.innerHTML = `<h2>Session total: ${getTotal(session, "human")}</h2>`;
        roundHistory.innerHTML = [...session.rounds].reverse().map((item) => `<article><h2>Round ${item.round} — color</h2><p>Your collision points: ${item.human?.collisionPoints ?? "—"}</p><table><thead><tr><th>Player</th><th>Answer</th><th>Collision points</th></tr></thead><tbody>${item.players.map((player) => `<tr><td>${escapeHtml(player.id)}</td><td>${escapeHtml(player.answer ?? player.canonical)}</td><td>${player.collisionPoints ?? "—"}</td></tr>`).join("")}</tbody></table></article>`).join("");
      }

      document.querySelector("#submit").addEventListener("click", () => {
        const text = answer.value.trim().toLowerCase();
        const human = text && /^[a-z]+$/.test(text) ? { id: "human", answer: text, canonical: text, status: "valid" } : { id: "human", answer: text, status: "invalid" };
        const scored = scoreRound([human, ...createSimulatedPlayers("color", session.rosterSize)]);
        const item = recordRound(session, "color", scored);
        answer.value = "";
        status.textContent = `Round ${item.round} recorded. The newest round is shown first.`;
        renderState();
      });

      renderState();
    </script>
  </body>
</html>
