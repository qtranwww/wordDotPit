<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordDotPit</title>
    <style>
      table { border-spacing: 18px 6px; }
      th, td { padding: 4px 10px; text-align: left; }
    </style>
  </head>
  <body>
    <main>
      <h1>wordDotPit</h1>
      <p>Round <strong id="round">1</strong></p>
      <p>Category: <strong>color</strong></p>
      <label for="answer">Your one-word answer</label>
      <input id="answer" autocomplete="off" />
      <button id="submit">Submit round</button>
      <p id="status" aria-live="polite"></p>
      <section id="session-score" aria-live="polite"><h2>Session total: 0 points</h2></section>
      <section id="round-history"></section>
    </main>
    <script type="module">
      import { scoreRound } from "./src/engine.js";
      import { createSimulatedPlayers } from "./src/simulated-ai.js";
      import { processAnswer } from "./src/pipeline.js";
      import { requestRealAiPlayers } from "./src/real-ai.js";
      import { createSession, getTotal, recordRound } from "./src/session.js";

      const session = createSession(["color"], 20);
      const answer = document.querySelector("#answer");
      const status = document.querySelector("#status");
      const sessionScore = document.querySelector("#session-score");
      const roundHistory = document.querySelector("#round-history");

      function escapeHtml(value) {
        return String(value ?? "—").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));
      }

      function renderState() {
        document.querySelector("#round").textContent = session.roundIndex + 1;
        const total = getTotal(session, "human");
        document.title = `wordDotPit — ${total} points`;
        sessionScore.innerHTML = `<h2>Session total: ${total} points</h2>`;
        roundHistory.innerHTML = [...session.rounds].reverse().map((item) => `<article><h2>Round ${item.round} — color</h2><p>Your collision points: ${item.human?.collisionPoints ?? "—"}</p><details><summary>Answer pipeline</summary><p>raw: ${escapeHtml(item.human?.pipeline.raw)} → repaired: ${escapeHtml(item.human?.pipeline.repaired)} → canonical: ${escapeHtml(item.human?.pipeline.canonical)} → ${escapeHtml(item.human?.pipeline.status)}${item.human?.pipeline.reason ? ` (${escapeHtml(item.human.pipeline.reason)})` : ""}</p></details><table><thead><tr><th>Player</th><th>Answer</th><th>Status</th><th>Collision points</th><th>Total Collisions</th></tr></thead><tbody>${item.players.map((player) => `<tr><td>${escapeHtml(player.id)}</td><td>${escapeHtml(player.answer ?? player.canonical)}</td><td>${escapeHtml(player.error ?? player.status)}</td><td>${player.collisionPoints ?? "—"}</td><td>${getTotal(session, player.id)}</td></tr>`).join("")}</tbody></table></article>`).join("");
      }

      document.querySelector("#submit").addEventListener("click", async () => {
        const submitButton = document.querySelector("#submit");
        submitButton.disabled = true;
        status.textContent = "Requesting 5 real AI players...";
        const text = answer.value;
        const pipeline = processAnswer(text, "color");
        const human = { id: "human", answer: text, canonical: pipeline.canonical, status: pipeline.status, pipeline };
        const realAi = await requestRealAiPlayers({ count: 5, concurrency: 5, onProgress: (completed, total) => { status.textContent = `Real AI players: ${completed}/${total} complete`; } });
        const scored = scoreRound([human, ...realAi, ...createSimulatedPlayers("color", session.rosterSize)]);
        const item = recordRound(session, "color", scored);
        item.human.pipeline = pipeline;
        answer.value = "";
        status.textContent = `Round ${item.round} recorded. The newest round is shown first.`;
        renderState();
        submitButton.disabled = false;
      });

      renderState();
    </script>
  </body>
</html>
